name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Base tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build theme assets
        run: npm run build

      - name: Verify generated assets are committed
        run: git diff --exit-code -- assets/css/style.css assets/js/script.js

      - name: Package theme ZIP
        run: npm run zip

      - name: Validate theme with GScan
        run: npm run gscan

      - name: Upload theme ZIP artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: atilla-rw-custom-${{ github.sha }}
          path: dist/atilla-rw-custom.zip
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy theme to Readwise Blog
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: ghost-theme-production
      cancel-in-progress: false

    steps:
      - name: Download validated theme ZIP
        uses: actions/download-artifact@v4
        with:
          name: atilla-rw-custom-${{ github.sha }}
          path: dist

      - name: Deploy theme
        uses: TryGhost/action-deploy-theme@b1ff2a5eeac1d5438a0aab35eb996fe4010d889e # v2
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          version: v6.0
          file: dist/atilla-rw-custom.zip
